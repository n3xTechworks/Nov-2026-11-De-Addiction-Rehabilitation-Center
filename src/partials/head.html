<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#24584A">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('harborlight-theme');
        var d = localStorage.getItem('harborlight-dir');
        if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('dir', d === 'rtl' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;display=swap" rel="stylesheet">
{{preload_tag}}  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/pages/{{css}}.css">
  <script defer src="data/site-data.js"></script>
  <script defer src="js/validation.js"></script>
  <script defer src="js/site.js"></script>
  <script defer src="js/pages/{{js}}.js"></script>
</head>
<body class="{{body_class}}">
